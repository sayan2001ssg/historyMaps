<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>CBSE History Map Work</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: an atlas room — chapter index of map plates, then a map table with the question card beside it.
   System fonts only, so the page works with no internet connection. */
:root{
  --bg:#f4f5f1; --panel:#ffffff; --ink:#1e2a33; --muted:#5d6a72; --line:#d8ddd6;
  --accent:#2c5d8f; --accent-ink:#ffffff; --accent-soft:#e3ecf5;
  --sea:#d6e6ee; --land:#e9e7da; --india:#fbf8ec; --border:#8d8b7c; --state:#c2bda6; --river:#5f97c4;
  --mark:#b8326a; --good:#2e7d4f; --good-soft:#e2f2e8; --warn:#a86a09; --warn-soft:#f8eed9; --bad:#c0392b; --bad-soft:#f8e3e0;
  --halo:#fbf8ec;
  --f-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --f-data:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a1e; --panel:#1c2429; --ink:#e4e9ec; --muted:#9aa7ae; --line:#2f3a40;
  --accent:#7fb0e0; --accent-ink:#0f1a24; --accent-soft:#22313d;
  --sea:#17262f; --land:#2a2e2a; --india:#353a33; --border:#7a7d70; --state:#565b4f; --river:#4f86b3;
  --mark:#ef6f9f; --good:#5cc489; --good-soft:#1d3327; --warn:#e2a64a; --warn-soft:#382c16; --bad:#ef7a6c; --bad-soft:#3a201d;
  --halo:#353a33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1e; --panel:#1c2429; --ink:#e4e9ec; --muted:#9aa7ae; --line:#2f3a40;
  --accent:#7fb0e0; --accent-ink:#0f1a24; --accent-soft:#22313d;
  --sea:#17262f; --land:#2a2e2a; --india:#353a33; --border:#7a7d70; --state:#565b4f; --river:#4f86b3;
  --mark:#ef6f9f; --good:#5cc489; --good-soft:#1d3327; --warn:#e2a64a; --warn-soft:#382c16; --bad:#ef7a6c; --bad-soft:#3a201d;
  --halo:#353a33; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 14px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:1.45rem;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 16px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 13px;font-size:.88rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.settings{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;margin-bottom:22px}
.settings label{display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--muted);font-weight:600}
.part{margin-bottom:26px}
.part-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.part-head h2{font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 16px;min-width:0}
.card:hover{border-color:var(--accent)}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-data);font-size:.75rem;color:var(--muted)}
.card h3{font-size:1.05rem}
.card p{margin:0;color:var(--muted);font-size:.84rem;line-height:1.4}
.best{font-family:var(--f-data);font-size:.75rem;color:var(--good)}
.card.mix{background:var(--accent-soft);border-color:transparent}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}.layout .side{order:-1}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.mapbox{position:relative;width:100%;aspect-ratio:1029/960;max-height:82vh;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sea)}
.mapbox svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.mapbox.tap svg{cursor:crosshair}
.sea{fill:var(--sea)}
.land{fill:var(--land);stroke:var(--border);stroke-width:.7;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.land.india{fill:var(--india);stroke-width:1.1}
.states{fill:none;stroke:var(--state);stroke-width:.7;vector-effect:non-scaling-stroke;stroke-dasharray:3 2}
.rivers path{fill:none;stroke:var(--river);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.no-rivers .rivers,.no-states .states{display:none}
.sealbl{fill:var(--river);font-family:var(--f-display);font-style:italic;font-size:15px;letter-spacing:.08em;opacity:.8}
.mapctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:1.1rem;font-weight:600;line-height:1}
.maptog{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.maptog button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:.78rem}
.maptog button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.maphint{position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.75rem;color:var(--muted);pointer-events:none}
/* overlay marks */
.o-region{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-dasharray:6 4}
.o-region.target{fill:var(--mark);fill-opacity:.2;stroke:var(--mark)}
.o-region.good{fill:var(--good);fill-opacity:.2;stroke:var(--good)}
.o-dot{stroke:var(--panel)}
.o-dot.study{fill:var(--accent)}
.o-dot.target{fill:var(--mark)}
.o-dot.good{fill:var(--good)}
.o-dot.hl{fill:var(--mark)}
.o-num{fill:var(--accent-ink);font-family:var(--f-data);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.o-lbl{fill:var(--ink);font-family:var(--f-body);font-weight:600;paint-order:stroke;stroke:var(--halo);stroke-linejoin:round;pointer-events:none}
.o-lbl.good{fill:var(--good)}
.o-pin{fill:none;stroke:var(--bad)}
.o-pin-c{fill:var(--bad)}
.o-line{stroke:var(--ink);stroke-dasharray:4 3;opacity:.6}
.pulse{fill:none;stroke:var(--mark);transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.6}}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.score{font-family:var(--f-data);font-size:.85rem;font-variant-numeric:tabular-nums}
.qtext{font-family:var(--f-display);font-size:1.3rem;line-height:1.3;margin:14px 0 4px}
.qsub{color:var(--muted);margin:0 0 6px;font-size:.92rem}
.qhow{font-size:.82rem;color:var(--muted);margin:8px 0 0}
.chip{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);padding:10px 12px;border-radius:8px}
.opt kbd{font-family:var(--f-data);font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:8px;padding:12px;margin-top:12px;font-size:.9rem}
.fb.good{background:var(--good-soft)} .fb.part{background:var(--warn-soft)} .fb.bad{background:var(--bad-soft)}
.fb strong{display:block;font-size:1rem;margin-bottom:2px}
.fb.good strong{color:var(--good)} .fb.part strong{color:var(--warn)} .fb.bad strong{color:var(--bad)}
.fb p{margin:6px 0 0}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li button{width:100%;display:flex;gap:10px;align-items:baseline;text-align:left;border:0;background:transparent;padding:7px 4px;border-bottom:1px solid var(--line)}
.list li:last-child button{border-bottom:0}
.list .n{font-family:var(--f-data);font-size:.75rem;color:var(--accent);min-width:1.6em;font-weight:700}
.list .kind{margin-left:auto;font-size:.72rem;color:var(--muted)}
.list li button[aria-current="true"]{background:var(--accent-soft)}
.fact{font-size:.86rem;color:var(--muted);margin:8px 0 0}
.res-big{font-family:var(--f-display);font-size:2.6rem;line-height:1}
.res-table{width:100%;border-collapse:collapse;font-size:.88rem}
.res-table td,.res-table th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.res-table th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.res-table td.num{font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:.75rem;font-weight:700}
.tag.good{color:var(--good)} .tag.part{color:var(--warn)} .tag.bad{color:var(--bad)}
.tablewrap{overflow-x:auto}
.crumbs{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.crumbs h2{font-size:1.35rem}
.note{font-size:.8rem;color:var(--muted)}
</style>

  <header class="top">

  <main id="view"></main>
</div>

 { n:1, part:"I", page:2, title:"Mature Harappan Sites", short:"Harappan sites",
   items:[
   {name:"Harappa", t:"p", lat:30.631, lon:72.864, fact:"Harappa (Punjab, Pakistan) on the old course of the Ravi — the first Harappan site to be discovered (1921); the civilisation is named after it."},
   {name:"Banawali", t:"p", lat:29.598, lon:75.392, fact:"Banawali, Fatehabad district, Haryana — terracotta models of a plough have been found here."},
   {name:"Kalibangan", t:"p", lat:29.474, lon:74.130, fact:"Kalibangan, Hanumangarh, Rajasthan, on the Ghaggar — evidence of a ploughed field and fire altars."},
   {name:"Balakot", t:"p", lat:25.47, lon:66.71, fact:"Balakot, Las Bela, Balochistan (Pakistan), near Sonmiani Bay — a coastal settlement known for shell-working."},
   {name:"Rakhigarhi", t:"p", lat:29.290, lon:76.114, fact:"Rakhigarhi, Hisar district, Haryana — one of the largest Harappan sites."},
   {name:"Dholavira", t:"p", lat:23.887, lon:70.213, fact:"Dholavira, Khadir island in the Rann of Kutch, Gujarat — divided into three parts, with large water reservoirs."},
   {name:"Nageshwar", t:"p", lat:22.333, lon:69.100, fact:"Nageshwar, on the southern shore of the Gulf of Kutch near Dwarka, Gujarat — a shell-working centre."},
   {name:"Lothal", t:"p", lat:22.522, lon:72.249, fact:"Lothal, Ahmedabad district, Gujarat, near the Gulf of Khambhat — dockyard and bead-making workshops."},
   {name:"Mohenjodaro", t:"p", lat:27.329, lon:68.138, fact:"Mohenjodaro, Larkana, Sindh (Pakistan), on the Indus — the best-known planned city; the Great Bath is here."},
   {name:"Chanhudaro", t:"p", lat:26.170, lon:68.320, fact:"Chanhudaro, Sindh (Pakistan), about 130 km south of Mohenjodaro — a small settlement devoted almost entirely to craft production (bead-making, seal-making)."},
   {name:"Kot Diji", t:"p", lat:27.344, lon:68.708, fact:"Kot Diji, Khairpur district, Sindh (Pakistan), east of the Indus — an important pre-Harappan / Harappan settlement."},
 ]},
 { n:2, part:"I", page:3, title:"Mahajanapadas and Cities", short:"Mahajanapadas",
   items:[
   {name:"Vajji", t:"r", lat:26.05, lon:85.35, r:100, fact:"Vajji — north Bihar, north of the Ganga; a gana/sangha (oligarchy) with its capital at Vaishali."},
   {name:"Magadha", t:"r", lat:25.10, lon:85.45, r:100, fact:"Magadha — south Bihar, south of the Ganga; capital Rajagaha (Rajgir), later Pataliputra. Became the most powerful mahajanapada."},
   {name:"Kosala", t:"r", lat:26.90, lon:82.10, r:140, fact:"Kosala — eastern Uttar Pradesh (Awadh region); capital Shravasti, Ayodhya was also in Kosala."},
   {name:"Kuru", t:"r", lat:29.10, lon:77.40, r:130, fact:"Kuru — upper Ganga–Yamuna doab and Haryana (Delhi–Meerut–Thanesar region); Hastinapura and Indraprastha."},
   {name:"Panchala", t:"r", lat:28.00, lon:79.30, r:130, fact:"Panchala — Rohilkhand / central doab (Bareilly–Farrukhabad region); Ahichchhatra and Kampilya."},
   {name:"Gandhara", t:"r", lat:33.90, lon:72.20, r:140, fact:"Gandhara — north-west (Peshawar valley and Rawalpindi region, Pakistan); capital Taxila (Takshashila)."},
   {name:"Avanti", t:"r", lat:23.00, lon:75.90, r:140, fact:"Avanti — western Madhya Pradesh (Malwa); capital Ujjayini (Ujjain)."},
   {name:"Rajgir", t:"p", lat:25.026, lon:85.420, fact:"Rajgir (Rajagaha), Nalanda district, Bihar — the early fortified capital of Magadha."},
   {name:"Ujjain", t:"p", lat:23.180, lon:75.784, fact:"Ujjain (Ujjayini), on the Shipra, Madhya Pradesh — capital of Avanti and a major trade centre."},

/* ---------- projection (must match the build script) ---------- */
const W=GEO.W, H=GEO.H, K=30, C=Math.cos(22*Math.PI/180), LON0=60.5, LAT0=37.5;
const proj=(lat,lon)=>[(lon-LON0)*C*K,(LAT0-lat)*K];
const unproj=(x,y)=>({lat:LAT0-y/K, lon:x/(C*K)+LON0});
function km(a,b){const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- prefs (best scores, toggles) ---------- */
const store={get(k,d){try{const v=localStorage.getItem("hmw:"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
             set(k,v){try{localStorage.setItem("hmw:"+k,JSON.stringify(v));}catch(e){}}};
const prefs={count:store.get("count",12),mode:store.get("mode","mixed"),rivers:store.get("rivers",true),states:store.get("states",true)};

/* ---------- base map ---------- */
const BASE=(()=>{
  const lands=GEO.countries.map(c=>`<path class="land${c.id==="IND"?" india":""}" d="${c.d}"><title>${esc(c.name)}</title></path>`);
  const ind=lands.findIndex(s=>s.includes("india"));const india=lands.splice(ind,1);
  const sl=(t,lat,lon)=>{const[x,y]=proj(lat,lon);return `<text class="sealbl" x="${x}" y="${y}" text-anchor="middle">${t}</text>`;};
  return `<rect class="sea" x="${-W}" y="${-H}" width="${3*W}" height="${3*H}"/>
  <g>${lands.join("")}${india}</g>
  <path class="states" d="${GEO.states}"/>
  <g class="rivers">${GEO.rivers.map(r=>`<path d="${r.d}"><title>${esc(r.name)}</title></path>`).join("")}</g>
  ${sl("ARABIAN SEA",15.5,65.5)}${sl("BAY OF BENGAL",15.5,88)}${sl("INDIAN OCEAN",6.8,72)}`;
})();

function makeMap(host,{onTap,hint}={}){
  host.innerHTML=`<div class="mapbox${prefs.rivers?"":" no-rivers"}${prefs.states?"":" no-states"}${onTap?" tap":""}">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Outline map of the Indian subcontinent">${BASE}<g class="ov"></g></svg>
    ${hint?`<div class="maphint">${esc(hint)}</div>`:""}
    <div class="mapctl"><button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">−</button><button data-z="reset" aria-label="Reset view">⟲</button></div>
    <div class="maptog"><button data-t="rivers" aria-pressed="${prefs.rivers}">Rivers</button><button data-t="states" aria-pressed="${prefs.states}">State borders</button></div>
  </div>`;
  const box=host.firstElementChild, svg=box.querySelector("svg"), ov=svg.querySelector(".ov");
  let vb={x:0,y:0,w:W,h:H}, overlay=[];
  const upp=()=>{const r=svg.getBoundingClientRect();if(!r.width)return vb.w/600;return Math.max(vb.w/r.width,vb.h/r.height);};
  const toSvg=(cx,cy)=>{const r=svg.getBoundingClientRect(),s=upp();
    return{x:vb.x+(cx-r.left-(r.width-vb.w/s)/2)*s, y:vb.y+(cy-r.top-(r.height-vb.h/s)/2)*s};};
  const clamp=()=>{vb.w=Math.min(Math.max(vb.w,W/14),W);vb.h=vb.w*H/W;
    vb.x=Math.min(Math.max(vb.x,-0.1*W),1.1*W-vb.w);vb.y=Math.min(Math.max(vb.y,-0.1*H),1.1*H-vb.h);};
  const apply=()=>{clamp();svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);draw();};
  const zoomAt=(f,p)=>{const nw=Math.min(Math.max(vb.w*f,W/14),W),k=nw/vb.w;vb.x=p.x-(p.x-vb.x)*k;vb.y=p.y-(p.y-vb.y)*k;vb.w=nw;vb.h=nw*H/W;apply();};
  const center=()=>({x:vb.x+vb.w/2,y:vb.y+vb.h/2});

  function draw(){
    const u=upp();let s="";
    const dots=overlay.filter(o=>o.k==="dot"||(o.k==="region"&&o.num!=null)).map(o=>{const[x,y]=proj(o.lat,o.lon);o.x=x;o.y=y;return o;});
    for(const o of overlay){
      if(o.k==="region"){const[x,y]=proj(o.lat,o.lon);
        const rx=o.r/(111.32*Math.cos(o.lat*Math.PI/180))*C*K, ry=o.r/111.2*K;
        s+=`<ellipse class="o-region ${o.cls||""}" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" stroke-width="${1.6*u}" stroke-dasharray="${6*u} ${4*u}"/>`;
        if(o.num!=null){s+=`<circle class="o-dot ${o.dotCls||"study"}" cx="${x}" cy="${y}" r="${9*u}" stroke-width="${1.5*u}"/><text class="o-num" x="${x}" y="${y}" font-size="${10*u}">${o.num}</text>`;}
        if(o.label){s+=`<text class="o-lbl ${o.lblCls||""}" x="${x}" y="${o.num!=null?y+20*u:y-ry*0.55}" text-anchor="middle" font-size="${12.5*u}" stroke-width="${3.5*u}">${esc(o.label)}</text>`;}
      } else if(o.k==="dot"){const[x,y]=proj(o.lat,o.lon);const r=(o.num!=null?9:6)*u;
        if(o.pulse)s+=`<circle class="pulse" cx="${x}" cy="${y}" r="${r}" stroke-width="${2*u}"/>`;
        s+=`<circle class="o-dot ${o.cls||"study"}" cx="${x}" cy="${y}" r="${r}" stroke-width="${1.5*u}"/>`;
        if(o.num!=null)s+=`<text class="o-num" x="${x}" y="${y}" font-size="${10*u}">${o.num}</text>`;
        if(o.label){const left=dots.some(q=>q!==o&&q.x-x>0&&q.x-x<115*u&&Math.abs(q.y-y)<16*u);
          s+=`<text class="o-lbl ${o.lblCls||""}" x="${left?x-r-3*u:x+r+3*u}" y="${y+4.5*u}" text-anchor="${left?"end":"start"}" font-size="${12.5*u}" stroke-width="${3.5*u}">${esc(o.label)}</text>`;}
      } else if(o.k==="line"){const[a,b]=proj(o.a.lat,o.a.lon),[c,d]=proj(o.b.lat,o.b.lon);
        s+=`<line class="o-line" x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke-width="${1.5*u}" stroke-dasharray="${4*u} ${3*u}"/>`;
      } else if(o.k==="pin"){const[x,y]=proj(o.lat,o.lon);
        s+=`<circle class="o-pin" cx="${x}" cy="${y}" r="${8*u}" stroke-width="${2.5*u}"/><circle class="o-pin-c" cx="${x}" cy="${y}" r="${2.5*u}"/>
            <path class="o-pin" d="M${x-13*u},${y}h${7*u}M${x+6*u},${y}h${7*u}M${x},${y-13*u}v${7*u}M${x},${y+6*u}v${7*u}" stroke-width="${2*u}"/>`;
      }
    }
    ov.innerHTML=s;
  }

  // pointer: drag to pan, pinch to zoom, tap to answer
  const ptrs=new Map();let drag=null,pinch=null;
  svg.addEventListener("pointerdown",e=>{if(e.button>0)return;try{svg.setPointerCapture(e.pointerId);}catch(_){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){drag={sx:e.clientX,sy:e.clientY,vx:vb.x,vy:vb.y,moved:false};pinch=null;}
    else if(ptrs.size===2){const[p1,p2]=[...ptrs.values()];if(drag)drag.moved=true;
      pinch={d:Math.hypot(p1.x-p2.x,p1.y-p2.y)||1,vb:{...vb},m:toSvg((p1.x+p2.x)/2,(p1.y+p2.y)/2)};}
  });
  svg.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&ptrs.size>=2){const[p1,p2]=[...ptrs.values()];const d=Math.hypot(p1.x-p2.x,p1.y-p2.y)||1;
      const nw=Math.min(Math.max(pinch.vb.w*pinch.d/d,W/14),W),k=nw/pinch.vb.w;
      vb={x:pinch.m.x-(pinch.m.x-pinch.vb.x)*k,y:pinch.m.y-(pinch.m.y-pinch.vb.y)*k,w:nw,h:nw*H/W};apply();return;}
    if(drag){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(!drag.moved&&Math.hypot(dx,dy)>6)drag.moved=true;
      if(drag.moved){const s=upp();vb.x=drag.vx-dx*s;vb.y=drag.vy-dy*s;apply();}}
  });
  const end=e=>{if(!ptrs.has(e.pointerId))return;
    if(e.type==="pointerup"&&ptrs.size===1&&drag&&!drag.moved&&!pinch&&onTap){const p=toSvg(e.clientX,e.clientY);onTap(unproj(p.x,p.y));}
    ptrs.delete(e.pointerId);
    if(ptrs.size===0){drag=null;pinch=null;}
    else if(ptrs.size===1){const[p]=[...ptrs.values()];drag={sx:p.x,sy:p.y,vx:vb.x,vy:vb.y,moved:true};pinch=null;}
  };
  svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
  svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY>0?1.2:1/1.2,toSvg(e.clientX,e.clientY));},{passive:false});
  box.querySelector(".mapctl").addEventListener("click",e=>{const z=e.target.closest("button")?.dataset.z;if(!z)return;
    if(z==="in")zoomAt(1/1.5,center());else if(z==="out")zoomAt(1.5,center());else{vb={x:0,y:0,w:W,h:H};apply();}});
  box.querySelector(".maptog").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const t=b.dataset.t;
    prefs[t]=!prefs[t];store.set(t,prefs[t]);b.setAttribute("aria-pressed",prefs[t]);box.classList.toggle("no-"+t,!prefs[t]);});
  if(window.ResizeObserver)new ResizeObserver(()=>draw()).observe(svg);

  return{
    set(o){overlay=o;draw();},
    reset(){vb={x:0,y:0,w:W,h:H};apply();},
    fit(pts,padKm=120){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
      for(const p of pts){const[x,y]=proj(p.lat,p.lon);const pad=((p.r||0)+padKm)/111.2*K;
        x0=Math.min(x0,x-pad);y0=Math.min(y0,y-pad);x1=Math.max(x1,x+pad);y1=Math.max(y1,y+pad);}
      let w=Math.max(x1-x0,(y1-y0)*W/H,W/5);vb={x:(x0+x1)/2-w/2,y:(y0+y1)/2-w*H/W/2,w,h:w*H/W};apply();},
    setTap(on){box.classList.toggle("tap",on);},
    setHint(t){const h=box.querySelector(".maphint");if(h){h.textContent=t;h.hidden=!t;}},
  };
}

/* ---------- views ---------- */
const view=document.getElementById("view"), homeBtn=document.getElementById("homeBtn");
homeBtn.onclick=()=>showHome();
let keyHandler=null;
document.addEventListener("keydown",e=>{if(keyHandler&&!e.metaKey&&!e.ctrlKey&&!e.altKey)keyHandler(e);});

function bestFor(key){const b=store.get("best:"+key,null);return b==null?"":`Best ${b}%`;}

function showHome(){
  keyHandler=null;homeBtn.hidden=true;window.scrollTo(0,0);
  const parts=[["I","Part I"],["II","Part II"],["III","Part III"]];
  const seg=(name,opts)=>`<div class="seg" role="group" data-s="${name}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(prefs[name])===String(v)}">${l}</button>`).join("")}</div>`;
  view.innerHTML=`
  <div class="settings">
    <label>Questions per test${seg("count",[[10,"10"],[12,"12"],[15,"15"]])}</label>
    <label>Question type${seg("mode",[["mixed","Both"],["locate","Locate on map"],["identify","Identify marked place"]])}</label>
  </div>
  ${parts.map(([p,l])=>`<section class="part"><div class="part-head"><h2>${l} Maps</h2><span class="eyebrow">${CHAPTERS.filter(c=>c.part===p).length} maps</span></div>
    <div class="grid">${CHAPTERS.filter(c=>c.part===p).map(c=>`
      <button class="card" data-ch="${c.n}">
        <span class="meta"><span>MAP ${c.n}${c.page?` · PAGE ${c.page}`:""}</span><span>${c.items.length} places</span></span>
        <h3>${esc(c.title)}</h3>
        <p>${esc(c.items.map(i=>i.name.replace("Kingdom of the ","")).join(", "))}</p>
        <span class="best">${bestFor("ch"+c.n)}</span>
      </button>`).join("")}
      ${p==="III"?`<button class="card mix" data-ch="all"><span class="meta"><span>ALL 10 MAPS</span><span>random</span></span><h3>Mixed revision test</h3><p>Places drawn from every map in the list, like the map question in the board paper.</p><span class="best">${bestFor("all")}</span></button>`:""}
    </div></section>`).join("")}
  <p class="note">Everything on this page is built in, so it keeps working with no internet connection. Coordinates are those of the actual sites and modern towns; areas such as Mahajanapadas, kingdoms and provinces are shown as approximate zones.</p>`;
  view.querySelectorAll(".seg").forEach(s=>s.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    const k=s.dataset.s;prefs[k]=k==="count"?+b.dataset.v:b.dataset.v;store.set(k,prefs[k]);
    s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));}));
  view.querySelectorAll(".card").forEach(c=>c.onclick=()=>{const v=c.dataset.ch;if(v==="all")startQuiz("all");else showChapter(CHAPTERS[+v-1]);});
}

function itemKind(it){return it.t==="r"?(KIND[it.ch.n].r||"an area"):KIND[it.ch.n].p;}

function showChapter(ch){
  keyHandler=null;homeBtn.hidden=false;window.scrollTo(0,0);
  view.innerHTML=`
  <div class="crumbs"><span class="eyebrow">Map ${ch.n}${ch.page?` · Textbook page ${ch.page}`:""} · Part ${ch.part}</span></div>
  <div class="layout">
    <div id="mapHost"></div>
    <aside class="side">
      <div class="panel">
        <h2 style="font-size:1.35rem">${esc(ch.title)}</h2>
        <p class="qsub" style="margin-top:6px">Study the ${ch.items.length} places, then take a test of ${testSize(ch)} questions.</p>
        <div class="actions"><button class="btn primary" id="go">Start test</button><button class="btn" id="lbl" aria-pressed="true">Hide names</button></div>
      </div>
      <div class="panel"><ul class="list" id="lst">${ch.items.map((it,i)=>`<li><button data-i="${i}"><span class="n">${i+1}</span><span>${esc(it.name)}</span><span class="kind">${it.t==="r"?"area":"place"}</span></button></li>`).join("")}</ul>
      <p class="fact" id="fact">Select a place to read about it and find it on the map.</p></div>
    </aside>
  </div>`;
  const map=makeMap(document.getElementById("mapHost"));
  let showNames=true,sel=-1;
  const paint=()=>map.set(ch.items.map((it,i)=>it.t==="r"
      ?{k:"region",lat:it.lat,lon:it.lon,r:it.r,num:i+1,label:showNames||i===sel?it.name:null,dotCls:i===sel?"hl":"study"}
      :{k:"dot",lat:it.lat,lon:it.lon,num:i+1,cls:i===sel?"hl":"study",label:showNames||i===sel?it.name:null}).sort((a,b)=>(a.k==="region"?-1:1)-(b.k==="region"?-1:1)));
  paint();map.fit(ch.items,90);
  document.getElementById("go").onclick=()=>startQuiz(ch);
  const lb=document.getElementById("lbl");
  lb.onclick=()=>{showNames=!showNames;lb.textContent=showNames?"Hide names":"Show names";paint();};
  document.getElementById("lst").onclick=e=>{const b=e.target.closest("button");if(!b)return;sel=+b.dataset.i;
    document.querySelectorAll("#lst button").forEach(x=>x.setAttribute("aria-current",x===b));
    const it=ch.items[sel];document.getElementById("fact").textContent=it.fact;paint();map.fit([it],it.t==="r"?80:220);};
}

/* ---------- quiz building ---------- */
function testSize(scope){const n=scope==="all"?uniquePool().length:scope.items.length;
  return prefs.mode==="mixed"?Math.min(prefs.count,n*2):Math.min(prefs.count,n);}
function uniquePool(){const seen=new Set(),out=[];for(const it of shuffle(CHAPTERS.flatMap(c=>c.items))){if(!seen.has(it.name)){seen.add(it.name);out.push(it);}}return out;}

function tooClose(a,b){const d=km(a,b);
  if(a.t==="p"&&b.t==="p")return d<100;
  if(a.t==="r"&&b.t==="r")return d<Math.max(a.r,b.r);
  const r=a.t==="r"?a.r:b.r;return d<r+60;}
function makeOptions(it){
  const ok=c=>c.name!==it.name&&!tooClose(c,it);
  const pick=new Map();
  const add=list=>{for(const c of shuffle(list.slice())){if(pick.size>=3)break;if(ok(c)&&![...pick.values()].some(p=>p.name===c.name))pick.set(c.name,c);}};
  add(it.ch.items.filter(c=>c.t===it.t));
  add(CHAPTERS.flatMap(c=>c.items).filter(c=>c.t===it.t));
  add(CHAPTERS.flatMap(c=>c.items));
  return shuffle([it,...pick.values()]);
}
function buildQuiz(scope){
  const pool=scope==="all"?uniquePool():shuffle(scope.items.slice());
  const n=testSize(scope);let qs=[];
  if(prefs.mode==="mixed"){
    pool.forEach((it,i)=>{if(qs.length<n)qs.push({it,mode:i%2?"identify":"locate"});});
    const second=shuffle(qs.slice()).map(q=>({it:q.it,mode:q.mode==="locate"?"identify":"locate"}));
    while(qs.length<n&&second.length)qs.push(second.shift());
    qs=shuffle(qs);
    for(let i=1;i<qs.length;i++)if(qs[i].it===qs[i-1].it){const j=qs.findIndex((q,k)=>k>i&&q.it!==qs[i].it&&qs[k-1]?.it!==q.it);if(j>0)[qs[i],qs[j]]=[qs[j],qs[i]];}
  } else qs=pool.slice(0,n).map(it=>({it,mode:prefs.mode}));
  qs.forEach(q=>{if(q.mode==="identify")q.options=makeOptions(q.it);});
  return qs;
}

/* ---------- quiz ---------- */
function grade(it,pt){
  const d=km(it,pt);
  if(it.t==="r"){const out=Math.max(0,d-it.r);
    if(out===0)return{score:1,d,msg:`Your mark is inside the ${it.name} area.`};
    return{score:out<=80?0.5:0,d,msg:`Your mark is about ${Math.round(out)} km outside the ${it.name} area.`};}
  return{score:d<=60?1:d<=120?0.5:0,d,msg:`Your mark is ${Math.round(d)} km from ${it.name}.`};
}

function startQuiz(scope){
  const qs=buildQuiz(scope),key=scope==="all"?"all":"ch"+scope.n;
  const title=scope==="all"?"Mixed revision test":scope.title;
  let idx=0,total=0;const log=[];
  homeBtn.hidden=false;window.scrollTo(0,0);
  view.innerHTML=`
  <div class="crumbs"><span class="eyebrow">${scope==="all"?"All maps":`Map ${scope.n} · Part ${scope.part}`}</span></div>
  <div class="layout"><div id="mapHost"></div><aside class="side"><div class="panel" id="qp"></div></aside></div>`;
  let current=null,pin=null,answered=false;
  const map=makeMap(document.getElementById("mapHost"),{hint:"",onTap:pt=>{
    if(!current||current.mode!=="locate"||answered)return;pin=pt;map.set([{k:"pin",...pt}]);
    const b=document.getElementById("check");if(b)b.disabled=false;map.setHint("Tap again to move your mark");}});
  const qp=document.getElementById("qp");

  function head(){return `<div class="qtop"><span class="eyebrow">Question ${idx+1} of ${qs.length}</span><span class="score">Score ${fmt(total)} / ${idx}</span></div>
    <div class="progress"><i style="width:${idx/qs.length*100}%"></i></div>`;}

  function render(){
    current=qs[idx];pin=null;answered=false;const it=current.it;
    map.reset();
    if(current.mode==="locate"){
      map.setTap(true);map.set([]);map.setHint("Tap the map to place your mark");
      qp.innerHTML=`${head()}
        <p style="margin:14px 0 0"><span class="chip">Locate</span></p>
        <p class="qtext">${it.t==="r"?`Locate the area of <b>${esc(it.name)}</b>.`:`Locate and mark <b>${esc(it.name)}</b>.`}</p>
        <p class="qsub">${esc(capital(itemKind(it)))}${scope==="all"?` · ${esc(it.ch.short)}`:""}</p>
        <p class="qhow">${it.t==="r"?"Tap anywhere inside the area it covered.":"Tap its location. Zoom with the + button, scroll or pinch; drag to move the map."}</p>
        <div id="fbx"></div>
        <div class="actions"><button class="btn primary" id="check" disabled>Check answer</button><button class="btn ghost" id="skip">Skip</button></div>`;
      document.getElementById("check").onclick=checkLocate;
      document.getElementById("skip").onclick=()=>{pin=null;checkLocate();};
    } else {
      map.setTap(false);map.setHint("");
      map.set(it.t==="r"?[{k:"region",lat:it.lat,lon:it.lon,r:it.r,cls:"target"},{k:"dot",lat:it.lat,lon:it.lon,cls:"target",pulse:true}]
                        :[{k:"dot",lat:it.lat,lon:it.lon,cls:"target",pulse:true}]);
      qp.innerHTML=`${head()}
        <p style="margin:14px 0 0"><span class="chip">Identify</span></p>
        <p class="qtext">Identify the ${it.t==="r"?"area":"place"} marked on the map.</p>
        <p class="qsub">It is ${esc(itemKind(it))}${scope==="all"?` (${esc(it.ch.short)})`:""}.</p>
        <div class="opts">${current.options.map((o,i)=>`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o.name)}</span></button>`).join("")}</div>
        <div id="fbx"></div><div class="actions" id="nextRow"></div>`;
      qp.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickOption(+b.dataset.i));
    }
    keyHandler=e=>{
      if(!answered&&current.mode==="identify"&&/^[1-4]$/.test(e.key)){const i=+e.key-1;if(current.options[i])pickOption(i);}
      else if(e.key==="Enter"){const b=document.getElementById(answered?"next":"check");if(b&&!b.disabled){e.preventDefault();b.click();}}
    };
  }

  function nextBtn(){return `<button class="btn primary" id="next">${idx+1<qs.length?"Next question":"See results"}</button>`;}
  function after(){document.getElementById("next").onclick=()=>{idx++;if(idx<qs.length)render();else results();};
    document.getElementById("next").focus({preventScroll:true});}

  function checkLocate(){
    if(answered)return;answered=true;map.setTap(false);map.setHint("");const it=current.it;
    let g=pin?grade(it,pin):{score:0,d:null,msg:"Skipped."};total+=g.score;
    log.push({it,mode:"locate",score:g.score,detail:pin?(it.t==="r"&&g.d<=it.r?"inside":`${Math.round(it.t==="r"?g.d-it.r:g.d)} km away`):"skipped"});
    const ov=[];
    if(it.t==="r")ov.push({k:"region",lat:it.lat,lon:it.lon,r:it.r,cls:"good",label:it.name,lblCls:"good"});
    else ov.push({k:"dot",lat:it.lat,lon:it.lon,cls:"good",label:it.name,lblCls:"good"});
    if(pin){if(!(it.t==="r"&&g.score===1))ov.unshift({k:"line",a:pin,b:it});ov.push({k:"pin",...pin});}
    map.set(ov);map.fit(pin?[it,pin]:[it],it.t==="r"?60:180);
    feedback(g.score,g.msg,it);
    const row=document.querySelector(".actions");row.innerHTML=nextBtn();after();
  }
  function pickOption(i){
    if(answered)return;answered=true;const it=current.it,o=current.options[i],ok=o===it;total+=ok?1:0;
    log.push({it,mode:"identify",score:ok?1:0,detail:ok?"":`chose ${o.name}`});
    qp.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(current.options[j]===it)b.classList.add("right");else if(j===i)b.classList.add("wrong");});
    const ov=it.t==="r"?[{k:"region",lat:it.lat,lon:it.lon,r:it.r,cls:"good",label:it.name,lblCls:"good"}]:[{k:"dot",lat:it.lat,lon:it.lon,cls:"good",label:it.name,lblCls:"good"}];
    if(!ok){ov.push(o.t==="r"?{k:"region",lat:o.lat,lon:o.lon,r:o.r,label:o.name}:{k:"dot",lat:o.lat,lon:o.lon,cls:"study",label:o.name});}
    map.set(ov);
    feedback(ok?1:0,ok?`It is ${it.name}.`:`It is ${it.name}. You chose ${o.name}${!ok?` (also shown on the map)`:""}.`,it);
    document.getElementById("nextRow").innerHTML=nextBtn();after();
  }
  function feedback(score,msg,it){
    const c=score===1?"good":score>0?"part":"bad",h=score===1?"Correct":score>0?"Close — half mark":"Not quite";
    document.getElementById("fbx").innerHTML=`<div class="fb ${c}" role="status"><strong>${h}</strong>${esc(msg)}<p>${esc(it.fact)}</p></div>`;
    qp.querySelector(".score").textContent=`Score ${fmt(total)} / ${idx+1}`;
    qp.querySelector(".progress i").style.width=`${(idx+1)/qs.length*100}%`;
  }

  function results(){
    keyHandler=null;const pct=Math.round(total/qs.length*100);
    const prev=store.get("best:"+key,null);if(prev==null||pct>prev)store.set("best:"+key,pct);
    map.setTap(false);map.setHint("");map.reset();
    map.set(log.map(l=>l.it.t==="r"?{k:"region",lat:l.it.lat,lon:l.it.lon,r:l.it.r,cls:l.score===1?"good":"",label:l.it.name,lblCls:l.score===1?"good":""}
                                      :{k:"dot",lat:l.it.lat,lon:l.it.lon,cls:l.score===1?"good":"target",label:l.it.name,lblCls:l.score===1?"good":""}));
    const uniq=[...new Map(log.map(l=>[l.it.name,l.it])).values()];map.fit(uniq,80);
    const line=pct>=80?"Well prepared for this map.":pct>=50?"Good progress. Review the places marked in pink and try a new set.":"Study the map once more, then try a new set.";
    qp.innerHTML=`<span class="eyebrow">${esc(title)}</span>
      <p class="res-big" style="margin:10px 0 4px">${fmt(total)} <span style="font-size:1.2rem;color:var(--muted)">/ ${qs.length}</span></p>
      <p class="qsub">${pct}% · ${esc(line)}</p>
      <div class="actions"><button class="btn primary" id="again">New set of questions</button>${scope==="all"?"":`<button class="btn" id="study">Study map</button>`}</div>
      <div class="tablewrap" style="margin-top:14px"><table class="res-table"><thead><tr><th>#</th><th>Place</th><th>Type</th><th>Result</th></tr></thead><tbody>
      ${log.map((l,i)=>`<tr><td class="num">${i+1}</td><td>${esc(l.it.name)}</td><td>${l.mode==="locate"?"Locate":"Identify"}</td>
        <td><span class="tag ${l.score===1?"good":l.score>0?"part":"bad"}">${l.score===1?"Correct":l.score>0?"Half":"Wrong"}</span>${l.detail?`<br><span class="note">${esc(l.detail)}</span>`:""}</td></tr>`).join("")}
      </tbody></table></div>`;
    document.getElementById("again").onclick=()=>startQuiz(scope);
    const st=document.getElementById("study");if(st)st.onclick=()=>showChapter(scope);
  }
  render();
}
const fmt=v=>Number.isInteger(v)?String(v):v.toFixed(1);
const capital=s=>s.charAt(0).toUpperCase()+s.slice(1);

showHome();
</script>

</body></html>
